
name: Sync GitHub to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  sync:
    name: Mirror repository
    runs-on: ubuntu-latest

    steps:
      # Baixa o histórico completo do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Envia branches e tags para o GitLab
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # Adiciona o GitLab como destino
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/gabrielseixas1/Caloteiros-py"

          # Busca todas as branches do GitHub
          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            --prune

          # Envia todas as branches
          git push gitlab \
            'refs/remotes/origin/*:refs/heads/*'

          # Envia todas as tags
          git push gitlab --tags
